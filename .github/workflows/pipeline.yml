name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-devsecops

jobs:
  # ---------- 1) BUILD ----------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Salvar imagem para os próximos jobs
        run: docker save ${{ env.IMAGE }}:${{ github.sha }} -o image.tar

      - name: Guardar imagem
        uses: actions/upload-artifact@v4
        with:
          name: imagem-docker
          path: image.tar
          retention-days: 1

  # ---------- 2) SONAR ----------
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test

      - name: SonarCloud scan + Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------- 3) TRIVY (código, IaC, secrets e imagem) ----------
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Baixar imagem do job Build
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker
          path: ${{ runner.temp }}

      - name: Carregar imagem no Docker
        run: docker load -i "${{ runner.temp }}/image.tar"

      # --- Relatórios (nunca falham, geram o resultado completo) ---
      - name: Relatório - IaC (Dockerfile e Kubernetes)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          exit-code: "0"

      - name: Relatório - dependências
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-deps.sarif
          exit-code: "0"

      - name: Relatório - imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Guardar relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-trivy
          path: "*.sarif"

      - name: Enviar SARIF (IaC) ao GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Enviar SARIF (dependências) ao GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

      - name: Enviar SARIF (imagem) ao GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # --- Gates (bloqueiam a pipeline) ---
      - name: Gate - IaC (HIGH/CRITICAL)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Gate - secrets no código
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

      - name: Gate - dependências (CRITICAL)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate - imagem (HIGH/CRITICAL)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ---------- 4) PUSH (Docker Hub) ----------
  push:
    name: Push (Docker Hub)
    runs-on: ubuntu-latest
    needs: [build, sonar, trivy]
    if: github.event_name != 'pull_request'
    steps:
      - name: Baixar imagem do job Build
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker

      - name: Carregar imagem no Docker
        run: docker load -i image.tar

      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push da imagem
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker tag  ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:latest

  # ---------- 5) DEPLOY (kind, runner na sua máquina) ----------
  deploy:
    name: Deploy (kind)
    runs-on: self-hosted
    needs: push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy no cluster kind
        shell: powershell
        run: |
          kubectl cluster-info
          (Get-Content k8s/deployment.yaml) -replace 'IMAGE_PLACEHOLDER', "${{ env.IMAGE }}:${{ github.sha }}" | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/frontend --timeout=120s
          kubectl get pods,svc

      - name: Testar aplicação
        shell: powershell
        run: |
          $url = "http://localhost:8082"
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              Write-Host "OK ($($r.StatusCode)) em $url"
              "### Aplicação disponível em: $url" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
              exit 0
            } catch {
              Write-Host "Tentativa $i falhou, aguardando..."
              Start-Sleep -Seconds 3
            }
          }
          exit 1

      - name: Diagnóstico em caso de falha
        if: failure()
        shell: powershell
        run: |
          kubectl get pods,svc -o wide
          kubectl describe deployment frontend
          kubectl logs deployment/frontend --all-containers --tail=50