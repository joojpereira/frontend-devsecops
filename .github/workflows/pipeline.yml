name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-devsecops

jobs:
  # ---------- Qualidade: testes + SonarCloud ----------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test

      - name: SonarCloud scan + Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------- Segurança: IaC (Dockerfile e Kubernetes) ----------
  security-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - IaC (relatório)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          exit-code: "0"

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-iac
          path: trivy-iac.sarif

      - name: Enviar SARIF ao GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Trivy - IaC (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------- Segurança: secrets no código ----------
  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trivy - secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

  # ---------- Segurança: dependências da aplicação ----------
  security-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - dependências (relatório)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-deps.sarif
          exit-code: "0"

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-dependencias
          path: trivy-deps.sarif

      - name: Trivy - dependências (gate CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------- Build + Trivy da imagem + Push ----------
  build-scan-push:
    runs-on: ubuntu-latest
    needs: [quality, security-iac, security-secrets, security-deps]
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Trivy - imagem (relatório)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Guardar relatório da imagem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-imagem
          path: trivy-image.sarif

      - name: Enviar SARIF da imagem ao GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy - imagem (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push da imagem
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker tag  ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:latest

  # ---------- Deploy no kind (runner na sua máquina) ----------
  deploy:
    runs-on: self-hosted
    needs: build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy no cluster kind
        shell: powershell
        run: |
          kubectl cluster-info
          (Get-Content k8s/deployment.yaml) -replace 'IMAGE_PLACEHOLDER', "${{ env.IMAGE }}:${{ github.sha }}" | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/frontend --timeout=120s
          kubectl get pods,svc

      - name: Testar aplicação
        shell: powershell
        run: |
          $url = "http://localhost:8082"
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              Write-Host "OK ($($r.StatusCode)) em $url"
              "### Aplicação disponível em: $url" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
              exit 0
            } catch {
              Write-Host "Tentativa $i falhou, aguardando..."
              Start-Sleep -Seconds 3
            }
          }
          exit 1

      - name: Diagnóstico em caso de falha
        if: failure()
        shell: powershell
        run: |
          kubectl get pods,svc -o wide
          kubectl describe deployment frontend
          kubectl logs deployment/frontend --all-containers --tail=50